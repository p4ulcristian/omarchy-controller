# iris-controller settings. Copy to ~/.config/iris-controller/config.toml.
# Everything is optional; with no file the controller works on its own.

# R1 held = push-to-talk dictation with omarchy-dictation
# (https://github.com/p4ulcristian/omarchy-dictation), or any daemon whose Unix socket
# accepts "start" and "stop". Unset = R1 does nothing.
# [dictate]
# socket = "/run/user/1000/iris-dictation/iris-dictation.sock"

# L1 held = dictate and send the transcript to an Iris server instead of
# typing it. Needs the dictate socket above to also accept "stop-return"
# (stop and reply with the text). The secret is read from a KEY=value file so
# it stays out of this one. L1 tapped twice runs `open`.
# [iris]
# url = "http://127.0.0.1:4270/api/chat"
# open = "omarchy-launch-webapp http://127.0.0.1:4270"
# secret_file = "~/path/to/.env"
# secret_key = "IRIS_INTERNAL_SECRET"

# The on-screen keyboard (R1 twice) has a top row of extras: pick one and ✕
# types the whole text, or presses the shortcut. These replace the defaults;
# [] hides the row.
# [keyboard]
# extras = ["https://", ".com", "@gmail.com", "~/",
#           { keys = "SHIFT + ENTER" }, { keys = "CTRL + B", label = "Background" }]

# Rename actions in the cheat sheet.
# [labels]
# "Close window" = "Quit"

# What each press just did flashes mid-screen: combos ("L2 + □ ▸ Copy",
# "L2 + R-stick ▸ Workspace 3") and plain presses ("□ ▸ Enter", "D-pad ▸ Up").
# Both on by default.
# [flash]
# combos = false
# buttons = false

# Hold L2 or R2 and what can follow it shows at that side of the screen
# until you let go. On by default.
# [guide]
# enabled = false
# delay = 0.3        # seconds of holding before it shows (default 0: at once)

# Your own buttons. Each [[bind]] adds one; they show up in the cheat sheet.
#   input: "L1 + <button>", "PS + <button>", "R2 + <D-pad ↑ → ↓ ←>",
#          "R2 double" or "L2 double" (an R2 double tap delays every R2 hold by 0.25 s)
#          buttons: ✕ ○ □ △ (or x o square triangle), L1 R1 L2 R2 L3 R3,
#          Options, Create, PS
#   run:   a shell command, or keys = "SUPER + W" to send a key combo
#   label: the name in the cheat sheet
# [[bind]]
# input = "L2 double"
# run = "omarchy-launch-webapp https://example.com"
# label = "Open my web app"
#
# [[bind]]
# input = "L1 + ○"
# keys = "SUPER + B"
# label = "Browser"
